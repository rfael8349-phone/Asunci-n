<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ruinas 16-Bit 3D — Esqueletos y Zombis Rabiosos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- HUD retro 16-bit -->
  <div id="hud">
    <div id="hud-left">
      <div class="stat-row">
        <span class="stat-label">HP</span>
        <div class="bar-frame"><div id="hp-bar"></div></div>
        <span id="hp-text">100</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">ESTAMINA</span>
        <div class="bar-frame"><div id="stamina-bar"></div></div>
        <span id="stamina-text">100</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">OLEADA</span>
        <span id="wave-text">1</span>
        <span class="stat-sep">|</span>
        <span class="stat-label">PUNTOS</span>
        <span id="score-text">0</span>
        <span class="stat-sep">|</span>
        <span class="stat-label">COMBO</span>
        <span id="combo-text">x1</span>
      </div>
    </div>
    <div id="hud-right">
      <div id="zone-banner">PATIO DE LAS RUINAS</div>
      <div id="audio-status">SONIDO: ACTIVO (Toca/Pulsa para oír)</div>
    </div>
  </div>

  <!-- Banner central de oleada / derrota -->
  <div id="center-banner" class="hidden"></div>

  <!-- Controles táctiles para móvil -->
  <div id="touch-controls">
    <div id="joystick-zone">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
    </div>
    <div id="action-buttons">
      <button id="btn-attack" type="button">TAJO (J / Click)</button>
      <button id="btn-heavy" type="button">GOLPE FUERTE (K)</button>
      <button id="btn-dash" type="button">ESQUIVE (Shift)</button>
      <button id="btn-jump" type="button">SALTO (Espacio)</button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
